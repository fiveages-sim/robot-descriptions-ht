# Common controller defaults shared by panthera_ht ros2_control variants.
# Single-arm specifics live in ros2_controllers.yaml; dual overrides in dual.yaml.

controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ocs2_arm_controller:
      type: ocs2_arm_controller/Ocs2ArmController

ocs2_arm_controller:
  ros__parameters:
    update_rate: 500  # Hz
    # POSITION: kp/kd 不再作为命令接口导出（增益由硬件参数管理）
    command_interfaces:
      - position
      - velocity
      - effort
    state_interfaces:
      - position
      - velocity
      - effort
    future_time_offset: 1.0
    robot_name: panthera_ht
    mpc_frequency: 100
    home_duration: 3.0
    home_interpolation_type: linear
    hold_first_check_position_threshold: 0.15
    hold_position_threshold: 0.15
