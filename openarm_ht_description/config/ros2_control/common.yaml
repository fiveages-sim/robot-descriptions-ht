# 写在这里的是默认值，'dual.yaml' 'single.yaml' 中的同名参数会覆盖这里的内容

controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ocs2_arm_controller:
      type: ocs2_arm_controller/Ocs2ArmController

ocs2_arm_controller:
  ros__parameters:
    update_rate: 500  # Hz
    command_interfaces:
      - position
      - velocity
      - effort
    state_interfaces:
      - position
      - velocity
      - effort
    future_time_offset: 2.0
    robot_name: openarm_ht
    mpc_frequency: 100

    home_duration: 3.0
    home_interpolation_type: linear

    hold_first_check_position_threshold: 0.15
    hold_position_threshold: 0.15

    movej_interpolation_type: none
    movej_duration: 0.005
